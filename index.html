<!DOCTYPE html>
<html>
<head>
<title>AI Ticket Classifier</title>
<style>
body{
font-family:Arial;
max-width:1200px;
margin:auto;
padding:20px;
}

textarea{
width:100%;
height:250px;
padding:10px;
}

button{
padding:12px 25px;
margin-top:10px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:20px;
border:1px solid #ccc;
background:#f5f5f5;
}
</style>
</head>
<body>

<h1>AI Ticket Classifier</h1>

<h3>Ticket Description</h3>

<textarea id="ticket"></textarea>

<br>

<button onclick="analyzeTicket()">
Analyze Ticket
</button>

<div id="result">

Abteilung erscheint hier

</div>

<script>
function analyzeTicket(){

const text =
document.getElementById("ticket")
.value
.toLowerCase();

let department="General";

if(text.includes("netzwerk"))
department="IT Network";

else if(text.includes("drucker"))
department="IT Support";

else if(text.includes("gehalt"))
department="HR";

else if(text.includes("sicherheit"))
department="Safety Team";

document.getElementById("result").innerHTML=
"<h2>"+department+"</h2>";
}
</script>

</body>
</html>
